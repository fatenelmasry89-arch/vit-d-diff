<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SunMate</title><meta name="theme-color" content="#0E7C86" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0A1A1F" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SunMate"><meta name="description" content="SunMate: vitamin D companion / أنيس الشمس لمتابعة فيتامين د"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column phone app, RTL, bottom tab bar. Motif: the ng/mL gauge. */
:root{
  --bg:#F1F6F7; --surface:#FFFFFF; --ink:#0D2B33; --muted:#586F76; --line:#D8E4E7;
  --teal:#0E7C86; --on-teal:#FFFFFF; --soft:#DDF0F1; --sun:#E8A100; --sun-soft:#FFF1CC; --sun-ink:#6B4700;
  --bad:#C0392B; --bad2:#E0762B; --warn:#E8B400; --good:#2E8B57;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A1F; --surface:#112830; --ink:#E6F1F3; --muted:#92ABB1; --line:#1F3B44;
  --teal:#4CC3CD; --on-teal:#06222A; --soft:#12383F; --sun:#F5B72A; --sun-soft:#3A2D0B; --sun-ink:#F7D88A;
  --bad:#F0705F; --bad2:#F2955A; --warn:#F2C94C; --good:#5CC48A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A1F; --surface:#112830; --ink:#E6F1F3; --muted:#92ABB1; --line:#1F3B44;
  --teal:#4CC3CD; --on-teal:#06222A; --soft:#12383F; --sun:#F5B72A; --sun-soft:#3A2D0B; --sun-ink:#F7D88A;
  --bad:#F0705F; --bad2:#F2955A; --warn:#F2C94C; --good:#5CC48A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-block:14px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13.5px}
a{color:var(--teal)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.sun{background:var(--sun-soft);border-color:transparent;color:var(--sun-ink)}
.card.sun h3{color:var(--sun-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--teal);color:var(--on-teal);cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.disc{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#FFD66B,var(--sun));box-shadow:0 0 0 6px var(--sun-soft)}
.safe{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}

/* path cards */
.path{display:flex;gap:14px;align-items:flex-start;text-align:start;width:100%;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}
.path:hover{border-color:var(--teal)}
.path b{font-family:var(--f-display);font-size:18px;display:block}
.pnum{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--teal);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:20px}

/* forms */
label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:14.5px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.chk input{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}

/* gauge */
.gauge{direction:ltr;position:relative;padding-top:18px}
.bar{display:flex;height:14px;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%}
.mark{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:13px;line-height:1}
.mark:after{content:"";width:0;height:0;border:5px solid transparent;border-top-color:var(--ink);margin-top:1px}
.ticks{position:relative;height:20px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.big{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;color:#fff}

/* food */
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.step{display:flex;align-items:center;gap:8px;direction:ltr}
.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;font-family:inherit}
.step b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--line);border-radius:8px;overflow:hidden;direction:ltr}
.track i{display:block;height:100%;background:var(--teal);border-radius:8px}

/* dots */
.week{display:flex;gap:6px;justify-content:space-between}
.day{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.dot{width:28px;height:28px;border-radius:50%;margin:4px auto 0;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--on-teal)}
.dot.on{background:var(--good);border-color:var(--good)}
.dot.today{border-color:var(--sun)}

details.card summary{cursor:pointer;font-family:var(--f-display);font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:"+";color:var(--teal);font-size:22px;line-height:1}
details[open].card summary:after{content:"–"}
details .body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
ul.clean{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

nav.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;min-height:52px;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--teal);font-weight:600}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
textarea.rep{min-height:180px;font-size:14px;line-height:1.6}
.bonebox{background:var(--soft);border-radius:14px;padding:8px;text-align:center}
.bonebox svg{width:100%;height:auto;max-height:170px;display:block}
.pts{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--bg);border-radius:12px;padding:8px 12px;text-align:center;font-size:13px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:flex;gap:8px}
.badge{flex:1;text-align:center;font-size:12px;padding:8px 4px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted)}
.badge.on{border:1.5px solid var(--sun);background:var(--sun-soft);color:var(--sun-ink);font-weight:600}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-teal);font-size:15px}
.mk.on{background:var(--good);border-color:var(--good)}
.pt{font-size:13px;font-weight:600;color:var(--sun-ink);background:var(--sun-soft);border-radius:999px;padding:2px 10px;flex:none}
.hero{position:relative;background:var(--soft);border-radius:24px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.hero .disc.big{position:absolute;inset-block-start:-34px;inset-inline-end:-34px;width:140px;height:140px;box-shadow:0 0 0 16px var(--sun-soft)}
.hero .bonebox{position:relative;background:transparent;width:100%;max-width:340px}
.hero .pill{position:relative;background:var(--teal);color:var(--on-teal)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat b{font-family:var(--f-display);font-size:17px;display:block}
.btn.xl{font-size:18px;min-height:54px;width:100%}
.azeem{flex-direction:row;align-items:flex-start;gap:12px}
.azeem .bonebox{width:84px;flex:none;padding:4px}
.bubble{background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 12px;margin-top:4px}
.famrow{display:flex;flex-wrap:wrap;gap:8px}
.cele{border:2px solid var(--sun)}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bgrid>*{min-width:0}
.bd{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:13.5px;line-height:1.5}
.bd b{display:block;font-family:var(--f-display);font-size:15px;color:var(--muted)}
.bd.on{border:1.5px solid var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.bd.on b{color:var(--sun-ink)}
.cert{border:2px dashed var(--sun);border-radius:16px;padding:14px;background:var(--sun-soft);color:var(--sun-ink);display:flex;flex-direction:column;gap:8px}
.cert h3{color:var(--sun-ink)}
.chartbox{direction:ltr}
.chartbox svg{width:100%;height:auto;display:block}
.g30{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;direction:ltr}
.g30 i{display:block;aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line)}
.g30 i.on{background:var(--good);border-color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.ocr{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plate svg{width:100%;height:auto;max-height:150px;display:block}
.sunbox{display:flex;flex-direction:column;gap:10px}
.dishrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.bgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.track i,.mark{transition:all .4s ease}}
.langrow{display:flex;justify-content:flex-end}

.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tblw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tblw th,.tblw td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tblw th{background:var(--soft);font-weight:600;white-space:nowrap}
.tblw tr:last-child td{border-bottom:0}
.warnbox{background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-size:13.5px}
.pill.warnp{background:var(--sun-soft);color:var(--sun-ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.steps li[aria-current="step"]{color:var(--teal);font-weight:600}
.steps li.done{color:var(--ink)}
.guide{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.guide ol,.card ul{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.cardprev{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.prod{gap:4px}.srcs{margin:0}.srclist{margin:0}
.srcs a,.srclist a{overflow-wrap:anywhere}

/* ===== v10 design system + motion ===== */
:root{--r:18px;--r-sm:12px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sh1:0 1px 2px rgba(13,43,51,.06),0 4px 14px rgba(13,43,51,.06);--sh2:0 2px 4px rgba(13,43,51,.08),0 12px 28px rgba(13,43,51,.12);
  --grad:linear-gradient(135deg,var(--teal),#17A2AE)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.45);--grad:linear-gradient(135deg,#2FA9B3,#4CC3CD)}}
:root[data-theme="dark"]{--sh1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.45);--grad:linear-gradient(135deg,#2FA9B3,#4CC3CD)}
body{background:radial-gradient(900px 420px at 85% -80px,var(--sun-soft),transparent 70%),var(--bg);background-attachment:fixed}
.card{border-radius:var(--r);box-shadow:var(--sh1)}
.btn{background:var(--grad);border-radius:var(--r-sm);box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 18px -8px var(--teal);transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:none}
.btn.ghost,.btn.danger{background:transparent;box-shadow:none}
.btn.ghost:hover{border-color:var(--teal)}
.path{border-radius:var(--r);box-shadow:var(--sh1);transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s}
.path:hover{transform:translateY(-2px);box-shadow:var(--sh2)}.path:active{transform:scale(.985)}
.chip{transition:background .2s,color .2s,transform .15s var(--spring)}.chip:active{transform:scale(.93)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--soft);outline:none}
nav.tabs{box-shadow:0 -8px 24px rgba(13,43,51,.08);border-top-left-radius:18px;border-top-right-radius:18px}
nav.tabs button{transition:color .2s}
nav.tabs button[aria-current="page"]{position:relative}
nav.tabs button[aria-current="page"]:before{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--grad)}
.pnum{background:var(--soft)}
/* sunrise hero */
.hero{background:linear-gradient(180deg,var(--soft) 0%,var(--sun-soft) 140%);border-radius:28px;box-shadow:var(--sh1)}
.hero .disc.big{width:150px;height:150px;inset-block-start:-40px;inset-inline-end:-40px;background:radial-gradient(circle at 35% 35%,#FFE08A,var(--sun));box-shadow:0 0 0 16px var(--sun-soft),0 0 80px 20px rgba(232,161,0,.35)}
.hero .disc.big:before{content:"";position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(232,161,0,.28) 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%);mask:radial-gradient(circle,transparent 38%,#000 40%,transparent 70%)}
.hero .disc.big{overflow:visible}
.sunarc{width:100%;height:auto;display:block}
.sunarc .win{stroke:var(--sun);stroke-width:9;stroke-linecap:round;fill:none;opacity:.9}
.sunarc .track{stroke:var(--line);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.sunarc text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.sunarc .ground{stroke:var(--line);stroke-width:2}
.sunarc .sunm{fill:var(--sun);filter:drop-shadow(0 0 6px rgba(232,161,0,.7))}
.sunarc .dim{opacity:.4}
.burstp{position:fixed;z-index:60;pointer-events:none;font-size:18px;line-height:1;color:var(--sun);will-change:transform,opacity}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sunrise{from{opacity:0;transform:translateY(70px) scale(.7)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 18px -8px var(--teal)}50%{box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 30px -2px var(--teal)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.7);color:var(--sun)}100%{transform:scale(1)}}
@keyframes markIn{from{left:0}}
@keyframes segIn{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes drawArc{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.streakn{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .wrap.enter>*{animation:fadeUp .5s var(--ease) both}
  .wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.09s}.wrap.enter>*:nth-child(4){animation-delay:.14s}
  .wrap.enter>*:nth-child(5){animation-delay:.19s}.wrap.enter>*:nth-child(6){animation-delay:.24s}.wrap.enter>*:nth-child(7){animation-delay:.29s}
  .wrap.enter>*:nth-child(n+8){animation-delay:.34s}
  .wrap.enter .hero .disc.big{animation:sunrise 1.4s var(--ease) both}
  .hero .disc.big:before{animation:spin 60s linear infinite}
  .wrap.enter .hero~div .feat{animation:fadeUp .6s var(--ease) both}
  .wrap.enter .feat:nth-child(1){animation-delay:.35s}.wrap.enter .feat:nth-child(2){animation-delay:.5s}.wrap.enter .feat:nth-child(3){animation-delay:.65s}
  .btn.xl{animation:pulse 2.8s ease-in-out 1.5s infinite}
  .wrap.enter .mark{animation:markIn 1.1s var(--ease) .2s both}
  .wrap.enter .bar i{transform-origin:bottom;animation:segIn .5s var(--ease) both}
  .wrap.enter .bar i:nth-child(2){animation-delay:.1s}.wrap.enter .bar i:nth-child(3){animation-delay:.2s}.wrap.enter .bar i:nth-child(4){animation-delay:.3s}
  .wrap.enter nav.tabs button[aria-current="page"] svg{animation:popIn .45s var(--spring)}
  .streakn.bump{animation:bump .7s var(--spring)}
  .cele{animation:popIn .55s var(--spring)}
  .sunarc .win{stroke-dasharray:var(--len);animation:drawArc 1.2s var(--ease) .2s both}
}

ar:[
 ['ليه النقص شائع في مصر؟','<p>رغم الشمس طول السنة، دراسة على 5046 عينة من أنحاء مصر لقت إن 17.2٪ بس عندهم فيتامين د أعلى من 30 ng/mL، والنقص أعلى بين السيدات.</p><p>في عينة مراهقين من محافظة واحدة، قلة النشاط والتعرض للشمس ارتبطت بالنقص، والبنات كانوا أكتر تأثراً.</p>'],
 ['أعراض النقص','<p>النقص الشديد بيسبب لين العظام عند الكبار والكساح عند الأطفال.</p><p>لكن أغلب الحالات في دراسة على أطفال مصريين كانت بدون أعراض أو بأعراض غير محددة، والتشنجات العضلية ظهرت عند الأطفال. عشان كده التحليل هو الطريق للتأكد، مش الأعراض لوحدها.</p>'],
 ['مصادر فيتامين د','<ul class="clean"><li>الأسماك الدهنية زي التونة والسلمون والماكريل من أفضل المصادر</li><li>المشروم فيه كمية</li><li>أغذية مدعّمة: اقرأ ملصق المنتج</li><li>الجلد بيصنّعه من أشعة الشمس فوق البنفسجية UVB</li></ul><p class="muted small">صعب تغطي احتياجك من الأكل لوحده.</p>'],
 ['إرشاد الجمعية الأمريكية للغدد الصماء 2024','<p>الإرشاد اقترح مكمل لأطفال ومراهقين من سنة لـ18، ولكبار 75 فأكتر، وللحوامل، ولمن عندهم مقدمات سكر عالية الخطورة. ولم يقترح مكملات فوق المقرر للأصحاء تحت 75.</p><p>ولمن فوق الخمسين ومحتاجين فيتامين د، الجرعة اليومية أفضل من الجرعات الكبيرة المتقطعة.</p>'],
 ['الجرعة الزايدة','<p>التسمم بفيتامين د بيحصل تقريباً دايماً من الإفراط في المكملات. الزيادة مش أحسن، ولازم تستشير الدكتور قبل أي جرعة عالية.</p>'],
 ['أشكال المكملات في الصيدلية','<p>بتتوفر عادةً كقطرات وأقراص وأمبولات للشرب وحقن. الشكل والجرعة قرار الدكتور حسب نتيجتك.</p><p class="muted small">قائمة الأسماء التجارية المسجلة في مصر هتتضاف من مصدر رسمي (هيئة الدواء المصرية) بدل ما تتكتب بدون توثيق.</p>']
],
en:[
 ['Why is deficiency common in Egypt?','<p>Despite year-round sun, a study of 5,046 samples from across Egypt found that only 17.2% had vitamin D above 30 ng/mL, and deficiency was higher among women.</p><p>In a sample of teenagers from one governorate, low physical activity and little sun exposure were linked to deficiency, and girls were more affected.</p>'],
 ['Symptoms of deficiency','<p>Severe deficiency causes osteomalacia (soft bones) in adults and rickets in children.</p><p>But in a study of Egyptian children, most cases had no symptoms or only non-specific ones, and muscle cramps appeared in children. That is why the blood test is the way to confirm, not symptoms alone.</p>'],
 ['Sources of vitamin D','<ul class="clean"><li>Fatty fish such as tuna, salmon and mackerel are among the best sources</li><li>Mushrooms provide some</li><li>Fortified foods: read the product label</li><li>The skin makes it from the sun’s UVB rays</li></ul><p class="muted small">It is hard to meet your needs from food alone.</p>'],
 ['Endocrine Society guideline 2024','<p>The guideline suggested supplementation for children and teens aged 1 to 18, adults 75 and older, pregnant women, and people with high-risk prediabetes. It did not suggest supplements above the recommended intake for healthy adults under 75.</p><p>For people over 50 who need vitamin D, daily dosing is preferred over intermittent high doses.</p>'],
 ['Too much vitamin D','<p>Vitamin D toxicity almost always comes from taking too many supplements. More is not better, and you should consult your doctor before any high dose.</p>'],

function streak(){

function jInfo(){
  var J=S.journey;if(!J)return null;
  var days=J.months*30,el=Math.max(0,Math.min(days,dayDiff(J.start,today())+1)),dp=0,fp=0,tg=foodTarget();
  Object.keys(S.log).forEach(function(d){var k=dayDiff(J.start,d);if(k>=0&&k<days)dp+=10});
  Object.keys(S.foodDays).forEach(function(d){var k=dayDiff(J.start,d);if(k>=0&&k<days){var v=S.foodDays[d];fp+=v>=tg*0.5?15:(v>0?5:0)}});
  var doses=S.plan.doseText?(S.plan.freq==='daily'?days:S.plan.freq==='weekly'?Math.ceil(days/7):Math.ceil(days/30)):0;
  var goal=Math.max(1,Math.round((doses*10+days*15)*0.85)),pts=dp+fp;
  return {days:days,el:el,pts:pts,dp:dp,goal:goal,p:Math.min(1,pts/goal),done:dayDiff(J.start,today())>=days}}

    '<g fill="'+fill+'">'+shapes+'</g>'+

    '<circle cx="142" cy="66" r="3.2" fill="var(--ink)"/><circle cx="178" cy="66" r="3.2" fill="var(--ink)"/>'+

/* 2. sun */
function sunArc(){
  var cx=150,cy=118,rx=128,ry=96;
  function pt(f){return [cx-rx*Math.cos(Math.PI*f),cy-ry*Math.sin(Math.PI*f)]}
  var now=new Date(),hr=now.getHours()+now.getMinutes()/60,f=(hr-6)/12,night=f<0||f>1,fc=Math.max(0,Math.min(1,f));
  var a=pt((10-6)/12),b=pt((15-6)/12),p0=pt(0),pc=pt(fc),len=Math.round(Math.PI*rx*0.5);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var path='M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+rx+' '+ry+' 0 0 1 '+pc[0].toFixed(1)+' '+pc[1].toFixed(1);
  return '<svg class="sunarc" viewBox="0 0 300 150" role="img" aria-label="'+esc(T('مسار الشمس خلال اليوم، ونافذة التعرض من 10 ص إلى 3 م','The sun’s path through the day, with the exposure window from 10:00 to 15:00'))+'">'+
  '<path class="track" d="M22 118 A128 96 0 0 1 278 118"/>'+
  '<line class="ground" x1="8" y1="118" x2="292" y2="118"/>'+
  '<path class="win" style="--len:'+len+'" d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' A'+rx+' '+ry+' 0 0 1 '+b[0].toFixed(1)+' '+b[1].toFixed(1)+'"/>'+
  '<text x="'+a[0].toFixed(0)+'" y="'+(a[1]-12).toFixed(0)+'" text-anchor="middle">10:00</text>'+
  '<text x="'+b[0].toFixed(0)+'" y="'+(b[1]-12).toFixed(0)+'" text-anchor="middle">15:00</text>'+
  '<text x="22" y="136" text-anchor="middle">6:00</text><text x="278" y="136" text-anchor="middle">18:00</text>'+
  '<circle class="sunm'+(night?' dim':'')+'" r="9" cx="0" cy="0"><animateMotion dur="'+(reduce?'0.01':'1.6')+'s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1" path="'+path+'"/></circle>'+
  '</svg>'+
  '<p class="small muted">'+T('رسم توضيحي: نهار تقريبي من 6 ص إلى 6 م. النافذة المرسومة (10 ص–3 م) هي الجزء المشترك بين المصدرين.','Illustrative schematic: approximate daylight 6:00–18:00. The drawn window (10:00–15:00) is the overlap of the two sources.')+'</p>'}

var bump=false,burstXY=null,lastKey='';
function burst(x,y){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cols=['var(--sun)','var(--teal)','var(--good)','#FFD66B'],g=['★','✦','✧','●'];
  for(var i=0;i<16;i++){
    var e=document.createElement('span');e.className='burstp';e.textContent=g[i%g.length];e.style.left=x+'px';e.style.top=y+'px';e.style.color=cols[i%cols.length];
    document.body.appendChild(e);
    var ang=Math.PI*2*i/16+Math.random()*.4,d=60+Math.random()*70;
    if(e.animate){var an=e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(ang)*d+'px),calc(-50% + '+(Math.sin(ang)*d+30)+'px)) scale(1.2) rotate('+(Math.random()*180)+'deg)',opacity:0}],{duration:800+Math.random()*300,easing:'cubic-bezier(.2,.8,.2,1)'});an.onfinish=function(){this.effect&&this.effect.target&&this.effect.target.remove()}}
    else e.remove()}
  setTimeout(function(){var n=document.querySelectorAll('.burstp');for(var i=0;i<n.length;i++)n[i].remove()},1500)}
function countUps(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var els=document.querySelectorAll('[data-count]');
  Array.prototype.forEach.call(els,function(el){
    var to=parseFloat(el.getAttribute('data-count')),dec=(String(el.getAttribute('data-count')).split('.')[1]||'').length,t0=null;
    if(isNaN(to))return;
    function step(ts){if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/900),e=1-Math.pow(1-k,3);
      el.firstChild.nodeValue=(to*e).toFixed(dec)+' ';if(k<1)requestAnimationFrame(step);else el.firstChild.nodeValue=to.toFixed(dec)+' '}
    requestAnimationFrame(step)})}

    '<p class="small">'+t('scanCheck')+'</p><div class="row"><button class="btn sm" data-act="ocrok">'+t('scanConfirm')+'</button><button class="btn ghost sm" data-act="ocrno">'+t('scanDiscard')+'</button></div></div>';

  if(st==='none')h+='<p class="small">'+t('scanNone')+'</p>';

  if(st==='denied')return h+'<p class="small">'+t('scanDenied')+'</p></div>';

function renderOcr(){var b=$('ocrbox');if(b)b.innerHTML=ocrHTML()}
function runOcr(file){
  ocr={st:'busy'};renderOcr();
  var prompt='This is a photo of a medical lab report. Find the 25-hydroxy vitamin D result (also written 25-OH vitamin D, 25(OH)D, Vitamin D total, or vitamin D3 25-OH). Transcribe only what is printed; never guess or infer a missing number. Reply with only a JSON object: {"found": boolean, "value": number, "unit": "ng/mL" or "nmol/L", "date": "YYYY-MM-DD" or null, "confidence": "high" or "low"}. If you cannot find it, reply {"found": false}.';
  sampleFn.json(prompt,{images:file}).then(function(r){
    if(!r||r.found!==true||typeof r.value!=='number'||!(r.value>0)||r.value>1000){ocr={st:'none'}}
    else ocr={st:'res',r:{value:r.value,unit:/nmol/i.test(String(r.unit||''))?'nmol':'ng',date:/^\d{4}-\d{2}-\d{2}$/.test(String(r.date||''))?r.date:'',low:r.confidence==='low'}};
    renderOcr()
  }).catch(function(e){
    var c=e&&e.code;
    ocr={st:(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable'||c==='not_declared'||c==='capability_disabled')?'denied':'err'};
    renderOcr()})}
function initSample(){

    }).catch(function(){})

   '<li>'+T('الاختبار المستخدم: 25-OH D الكلي في السيرم. 1,25-dihydroxy بس لأمراض الكلى وحالات اضطراب أيض الفوسفات.','Test: serum total 25-OH D. The 1,25-dihydroxy form is reserved for CKD and disorders of phosphate metabolism.')+'</li></ul>'+sl(['umn','aub','mdedge']));

   '<p><b>'+T('توصيات الخليج (GCC) كما وردت في دليل AUB','GCC recommendations as listed in the AUB guide')+'</b></p>'+

   '<p>'+T('Endocrine 2024: مكملات تفوق الاحتياج المعتاد بشكل تجريبي (empiric) للأعمار 1–18، فوق 75 سنة، الحمل، وما قبل السكر عالي الخطورة. لا يوصي بها للأعمار 19–74 غير ده. ومفيهوش جرعات جديدة وبيرجع لأرقام 2011.','Endocrine 2024: empiric supplementation beyond the usual intake for ages 1–18, over 75, pregnancy and high-risk prediabetes; not for other adults 19–74. It gives no new doses and defers to the 2011 figures.')+'</p>'+

    ['1–18 '+T('سنة','y'),T('2,000 وحدة/يوم أو 50,000 وحدة/أسبوع × 6 أسابيع','2,000 IU/day or 50,000 IU/week × 6 weeks'),'600–1,000'],
    ['19+ '+T('سنة','y'),T('6,000 وحدة/يوم أو 50,000 وحدة/أسبوع × 8 أسابيع','6,000 IU/day or 50,000 IU/week × 8 weeks'),'1,500–2,000']])+

   '<p><b>'+T('سمنة، سوء امتصاص، أدوية تزيد تكسير فيتامين د','Obesity, malabsorption, drugs that increase vitamin D catabolism')+'</b>: '+T('جرعات أعلى بمقدار 2–3 أضعاف (6,000–10,000 وحدة/يوم على الأقل للبالغين)، وصيانة 3,000–6,000 وحدة/يوم.','2–3 times higher doses (at least 6,000–10,000 IU/day in adults), with maintenance 3,000–6,000 IU/day.')+'</p>'+

   sl(['mdedge','acp','umn','munnspdf']),true);
  h+=sect(T('٥. الكساح الغذائي (إجماع عالمي 2016)','5. Nutritional rickets (2016 global consensus)'),
   '<ul><li>'+T('علاج يومي: 2,000 وحدة/يوم على الأقل لمدة 12 أسبوع على الأقل (الدراسات استخدمت لحد 5,000–10,000 وحدة D3).','Daily treatment: at least 2,000 IU/day for at least 12 weeks (studies used up to 5,000–10,000 IU of D3).')+'</li>'+

   '<li>'+T('الوقاية: 400 وحدة/يوم لكل الرضع من الولادة لسنة (رضاعة طبيعية أو صناعية)، و600 وحدة/يوم بعد سنة.','Prevention: 400 IU/day for all infants from birth to 12 months regardless of feeding, and 600 IU/day after 12 months.')+'</li>'+
   '<li>'+T('لا يوصي بفحص 25-OH D الروتيني في الأطفال الأصحاء.','Routine 25-OH D screening in healthy children is not recommended.')+'</li></ul>'+sl(['munns','munnspdf']));
  h+=sect(T('٦. الحمل والرضاعة والرضع','6. Pregnancy, lactation and infants'),

   '<li>'+T('الرضع: 400 وحدة/يوم نقط من بعد الولادة بوقت قصير. ممكن يحتاج لحد 800 لو بشرة داكنة أو تعرض شمس قليل. حليب الصناعي المدعّم ممكن يكفي.','Infants: 400 IU/day drops soon after birth; up to 800 IU may be needed with dark skin or little sun. Fortified formula may suffice.')+'</li></ul>'+

  h+=sect(T('٧. السلامة والتسمم','7. Safety and toxicity'),

function doseView(){
  var h='<div class="card"><h3>'+T('ملخص سريع للجرعات','Dose quick reference')+'</h3><p class="muted small">'+T('أرقام الإرشادات المنشورة كما هي. مش وصفة.','Published guideline figures as stated. Not a prescription.')+'</p></div>';
  h+=sect(T('وقاية (وحدة/يوم)','Prevention (IU/day)'),tbl([T('الفئة','Group'),T('الجرعة','Dose'),T('المصدر','Source')],[
   [T('رضع 0–12 شهر','Infants 0–12 mo'),'400','IOM / '+T('إجماع الكساح','rickets consensus')],
   [T('1–70 سنة','1–70 y'),'600','IOM / '+T('إجماع الكساح','rickets consensus')],
   [T('فوق 70','Over 70'),'800','IOM'],
   [T('بالغين (الخليج)','Adults (GCC)'),'800–2,000','AUB guide'],
   [T('سمنة (الخليج)','Obesity (GCC)'),'1,600–4,000','AUB guide'],
   [T('حوامل/مرضعات','Pregnant / lactating'),'600 (IOM) · 1,500–2,000 (GCC)','AUB guide']])+sl(['aub','munnspdf']),true);
  h+=sect(T('علاج النقص','Treatment of deficiency'),tbl([T('الفئة','Group'),T('يومي','Daily'),T('أسبوعي','Weekly'),T('صيانة','Maintenance')],[
   [T('رضع وأطفال 0–18','Infants & children 0–18'),'2,000 IU','50,000 IU × 6 '+T('أسابيع','wk'),'400–1,000 / 600–1,000'],
   [T('بالغين','Adults'),'6,000 IU','50,000 IU × 8 '+T('أسابيع','wk'),'1,500–2,000'],
   [T('سمنة/سوء امتصاص/أدوية','Obesity / malabsorption / drugs'),'≥6,000–10,000 IU','—','3,000–6,000'],
   [T('كساح غذائي','Nutritional rickets'),'≥2,000 IU × ≥12 '+T('أسبوع','wk'),'—','400 / 600']])+sl(['mdedge','umn','munnspdf']));
  h+=sect(T('الحد الأعلى المسموح (UL)','Upper limits (UL)'),'<p>'+T('0–6 شهور: 1,000 · 7–12 شهر: 1,500 · 1–3 سنين: 2,500 · 4–8: 3,000 · 9 سنين فأكثر: 4,000 وحدة/يوم.','0–6 mo: 1,000 · 7–12 mo: 1,500 · 1–3 y: 2,500 · 4–8 y: 3,000 · 9 y and above: 4,000 IU/day.')+'</p>'+sl(['aub']));

  var bar='<div class="langrow"><button class="btn ghost sm" data-act="lang" aria-label="Language / اللغة">'+t('lang')+'</button></div>';
  var sw=(!splash&&S.role)?'<button class="btn ghost sm" data-act="swrole">'+T('⇄ تغيير الواجهة','⇄ Switch interface')+'</button>':'';
  bar='<div class="langrow" style="gap:6px;flex-wrap:wrap">'+sw+'<button class="btn ghost sm" data-act="appearance" aria-expanded="'+(appearanceOpen?'true':'false')+'" aria-controls="appearance-panel" aria-label="'+T('المظهر والألوان','Appearance & colors')+'">◐ '+T('المظهر','Theme')+'</button><button class="btn ghost sm" data-act="lang" aria-label="Language / اللغة">'+t('lang')+'</button></div>';
  var body;
  if(splash)body=landingView();
  else if(!S.role)body=roleView();
  else if(S.role==='doctor')body=(S.doc&&S.doc.done)?docMain():docRegView();
  else body=S.onboard?mainView():onboardView();
  var key=splash?'s':(S.role||'r')+'|'+(S.role==='doctor'?((S.doc&&S.doc.done)?(S.dtab||'ref'):'reg'+docStep):(S.onboard?(S.tab||'home'):(S.seen?S.step:'x')))+'|'+S.lang+'|'+(S.cur||0);
  var enter=key!==lastKey;lastKey=key;
  app.className='wrap'+(enter?' enter':'');
  app.innerHTML=bar+(appearanceOpen?appearancePanel():'')+body;
  bump=false;
  if(enter)countUps();
  if(splash)startHero();else stopHero()}
render();
initSample();
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
